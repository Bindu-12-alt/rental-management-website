<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My History | RentEase</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand"><span>🏠</span><div><h1>RentEase</h1><small>Tenant Portal</small></div></div>
      <nav class="sidebar-nav">
        <a href="tenant-dashboard.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
        <a href="tenant-payments.html"><i class="fa-solid fa-money-bill-wave"></i> My Payments</a>
        <a href="tenant-agreements.html"><i class="fa-solid fa-file-contract"></i> My Agreement</a>
        <a href="tenant-deposits.html"><i class="fa-solid fa-wallet"></i> My Deposit</a>
        <a href="tenant-maintenance.html"><i class="fa-solid fa-screwdriver-wrench"></i> Maintenance</a>
        <a href="tenant-vacating.html"><i class="fa-solid fa-door-open"></i> Vacating Request</a>
        <a href="tenant-notifications.html"><i class="fa-solid fa-bell"></i> Notifications</a>
        <a class="active" href="tenant-history.html"><i class="fa-solid fa-clock-rotate-left"></i> My History</a>
        <a href="#" id="logoutLink"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
      </nav>
    </aside>
    <main class="content-area">
      <header class="topbar"><div><h2>My History</h2><p>Complete record of your rental activities.</p></div></header>
      <section class="recent-activities card">
        <div id="historyList"><p style="color:var(--muted); padding:1rem;">No history found.</p></div>
      </section>
    </main>
  </div>
  <script src="../js/tenant-api.js"></script>
  <script>
    tenantEnsureAuth();
    document.getElementById('logoutLink').addEventListener('click', (e) => { e.preventDefault(); tenantLogout(); });
    tenantRequest('/tenant-portal/history').then(res => {
      if (!res.data.length) return;
      document.getElementById('historyList').innerHTML = res.data.map(h => `
        <div class="activity-row">
          <div><strong>${h.type} — ${h.title}</strong><p>${h.description || ''}</p></div>
          <div class="activity-meta">
            <span>${h.apartment?.apartmentNumber || ''}</span>
            <small>${new Date(h.createdAt).toLocaleString()}</small>
          </div>
        </div>`).join('');
    }).catch(console.error);
  </script>
</body>
</html>
