<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payments | RentEase</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand"><span>🏠</span><div><h1>RentEase</h1><small>Rental Admin</small></div></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
        <a href="apartments.html"><i class="fa-solid fa-building"></i> Apartments</a>
        <a href="tenants.html"><i class="fa-solid fa-user"></i> Tenants</a>
        <a class="active" href="payments.html"><i class="fa-solid fa-money-bill-wave"></i> Payments</a>
        <a href="deposits.html"><i class="fa-solid fa-wallet"></i> Security Deposits</a>
        <a href="agreements.html"><i class="fa-solid fa-file-contract"></i> Rental Agreements</a>
        <a href="vacating.html"><i class="fa-solid fa-door-open"></i> Vacating Requests</a>
        <a href="notifications.html"><i class="fa-solid fa-bell"></i> Notifications</a>
        <a href="maintenance.html"><i class="fa-solid fa-screwdriver-wrench"></i> Maintenance</a>
        <a href="history.html"><i class="fa-solid fa-clock-rotate-left"></i> History</a>
        <a href="#" id="logoutLink"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
      </nav>
    </aside>
    <main class="content-area">
      <header class="topbar"><div><h2>Payments</h2><p>Record and review tenant rent payments.</p></div><div class="topbar-actions"><div class="topbar-search"><input id="searchInput" type="search" placeholder="Search payments" /><i class="fa-solid fa-magnifying-glass"></i></div><button class="button primary" id="createPaymentBtn">Add Payment</button></div></header>
      <section class="filters-panel"><select id="statusFilter"><option value="">All Statuses</option><option value="Paid">Paid</option><option value="Pending">Pending</option><option value="Overdue">Overdue</option></select></section>
      <section class="table-panel card"><table class="data-table"><thead><tr><th>Tenant</th><th>Apartment</th><th>Amount</th><th>Due Date</th><th>Payment Date</th><th>Status</th><th>Actions</th></tr></thead><tbody id="paymentsTableBody"></tbody></table></section>
      <section id="paymentFormSection" class="card hidden"><div class="panel-header"><h3 id="paymentFormTitle">Add Payment</h3></div><form id="paymentForm" class="module-form"><div class="form-grid"><div class="form-group"><label>Tenant</label><select id="payTenant" required><option value="">Select Tenant</option></select></div><div class="form-group"><label>Apartment</label><select id="payApartment" required><option value="">Select Apartment</option></select></div><div class="form-group"><label>Amount</label><input id="payAmount" type="number" min="0" required /></div><div class="form-group"><label>Due Date</label><input id="payDueDate" type="date" required /></div><div class="form-group"><label>Payment Date</label><input id="payPaymentDate" type="date" required /></div><div class="form-group"><label>Method</label><select id="payMethod" required><option value="">Select Method</option><option value="Bank Transfer">Bank Transfer</option><option value="Credit Card">Credit Card</option><option value="Debit Card">Debit Card</option><option value="Cash">Cash</option><option value="UPI">UPI</option></select></div><div class="form-group"><label>Transaction ID</label><input id="payTransaction" /></div><div class="form-group"><label>Status</label><select id="payStatus"><option value="Paid">Paid</option><option value="Pending">Pending</option><option value="Overdue">Overdue</option></select></div></div><div class="form-actions"><button type="submit" class="button primary">Save Payment</button><button type="button" id="cancelPaymentBtn" class="button outline">Cancel</button></div><p id="paymentFormError" class="form-error"></p></form></section>
    </main>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/payments.js"></script>
</body>
</html>
