<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | RentEase</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand"><span>🏠</span><div><h1>RentEase</h1><small>Rental Admin</small></div></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
        <a href="apartments.html"><i class="fa-solid fa-building"></i> Apartments</a>
        <a href="tenants.html"><i class="fa-solid fa-user"></i> Tenants</a>
        <a href="payments.html"><i class="fa-solid fa-money-bill-wave"></i> Payments</a>
        <a href="deposits.html"><i class="fa-solid fa-wallet"></i> Security Deposits</a>
        <a href="agreements.html"><i class="fa-solid fa-file-contract"></i> Rental Agreements</a>
        <a href="vacating.html"><i class="fa-solid fa-door-open"></i> Vacating Requests</a>
        <a href="notifications.html"><i class="fa-solid fa-bell"></i> Notifications</a>
        <a href="maintenance.html"><i class="fa-solid fa-screwdriver-wrench"></i> Maintenance</a>
        <a href="history.html"><i class="fa-solid fa-clock-rotate-left"></i> History</a>
        <a class="active" href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
        <a href="#" id="logoutLink"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
      </nav>
    </aside>
    <main class="content-area">
      <header class="topbar"><div><h2>Settings</h2><p>Manage RentEase preferences and admin profile settings.</p></div></header>
      <section class="card"><div class="panel-header"><h3>Admin Settings</h3></div><div class="module-form"><div class="form-grid"><div class="form-group"><label>Admin Email</label><input type="email" disabled value="admin@rentease.com" /></div><div class="form-group"><label>Notification Preferences</label><select><option>All Alerts</option><option>Only High Priority</option></select></div><div class="form-group full-width"><label>Support Info</label><textarea disabled>Contact support@rentease.com for technical assistance.</textarea></div></div></div></section>
    </main>
  </div>
  <script src="../js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!localStorage.getItem('rentease_token')) window.location.href = '../login.html';
      document.getElementById('logoutLink').addEventListener('click', (event) => { event.preventDefault(); localStorage.removeItem('rentease_token'); localStorage.removeItem('rentease_admin'); window.location.href = '../login.html'; });
    });
  </script>
</body>
</html>
