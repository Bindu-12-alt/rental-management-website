<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | RentEase</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-brand">
        <span>🏠</span>
        <div>
          <h1>RentEase</h1>
          <p>Create Admin Account</p>
        </div>
      </div>
      <div class="google-auth">
        <div id="googleSignInButton" class="google-auth-button"></div>
        <p id="googleAuthStatus" class="google-auth-status" role="status" aria-live="polite">Google signup is available only for the configured admin email.</p>
        <p id="googleAuthError" class="google-auth-error hidden" role="alert"></p>
      </div>
      <div class="auth-divider" aria-hidden="true"><span>OR</span></div>
      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input id="name" type="text" placeholder="Your name" autocomplete="name" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required />
        </div>
        <p id="registerError" class="form-error" aria-live="polite"></p>
        <button id="registerSubmit" type="submit" class="button primary full-width">Register</button>
      </form>
      <p style="margin-top:1rem; text-align:center; color:var(--muted);">
        Already have an account? <a href="login.html" style="color:var(--primary); font-weight:600;">Login</a>
      </p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/google-auth.js"></script>
  <script>initializeGoogleSignIn({ role: 'admin', destination: 'pages/dashboard.html' });</script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('registerError');
      const submitButton = document.getElementById('registerSubmit');
      errorEl.textContent = '';
      submitButton.disabled = true;
      submitButton.textContent = 'Creating account...';

      try {
        const response = await fetch(`${API_BASE_URL}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Registration failed');
        localStorage.setItem('rentease_token', data.token);
        localStorage.setItem('rentease_admin', JSON.stringify(data.admin));
        window.location.href = 'pages/dashboard.html';
      } catch (error) {
        errorEl.textContent = error.message || 'Registration failed. Please try again.';
        submitButton.disabled = false;
        submitButton.textContent = 'Register';
      }
    });
  </script>
</body>
</html>
