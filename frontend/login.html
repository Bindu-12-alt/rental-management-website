<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | RentEase</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-brand">
        <span>🏠</span>
        <div>
          <h1>RentEase</h1>
          <p>Admin Login</p>
        </div>
      </div>
      <p id="pageMessage" class="form-message"></p>
      <div class="google-auth">
        <div id="googleSignInButton" class="google-auth-button"></div>
        <p id="googleAuthStatus" class="google-auth-status" role="status" aria-live="polite">Choose a Google account; closing the sign-in window cancels.</p>
        <p id="googleAuthError" class="google-auth-error hidden" role="alert"></p>
      </div>
      <div class="auth-divider" aria-hidden="true"><span>OR</span></div>
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="example@gmail.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="password" required />
        </div>
        <p id="loginError" class="form-error"></p>
        <button type="submit" class="button primary full-width">Login</button>
      </form>
      <p style="margin-top:1rem; text-align:center; color:var(--muted);">Don't have an account? <a href="register.html" style="color:var(--primary); font-weight:600;">Register</a></p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/google-auth.js"></script>
  <script>initializeGoogleSignIn({ role: 'admin', destination: 'pages/dashboard.html' });</script>
</body>
</html>
